name: Physics news ticker

# Pulls the physics news feeds every morning and commits data/physics-news.json,
# which the Physics lab page reads. Nothing else on the site changes.

on:
  schedule:
    - cron: "55 5 * * *"     # 05:55 UTC daily, after the French rack (05:40)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: physics-news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the feeds
        run: python3 tools/fetch_physics_news.py
      - name: Commit if changed
        run: |
          git config user.name "ticker-bot"
          git config user.email "ticker-bot@users.noreply.github.com"
          git add data/physics-news.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Ticker: physics stories $(date -u +%Y-%m-%d)" && git pull --rebase && git push; fi
