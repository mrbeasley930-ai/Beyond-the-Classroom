name: Music programme

# Reads this week's episodes of the Radio 3 and Radio 4 music programmes from the BBC programme
# pages and the music news feeds every morning, and commits data/music-news.json, which the
# Music page ("The Score") reads for the programme at the back. Nothing else on the site changes.

on:
  schedule:
    - cron: "40 6 * * *"     # 06:40 UTC daily, after the French rack (05:40), the Physics ticker (05:55), the Engineering pit wall (06:10) and the Geography hazard board (06:25)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the programme
        run: python3 tools/fetch_music_news.py
      - name: Commit if changed
        run: |
          git config user.name "page-turner-bot"
          git config user.email "page-turner-bot@users.noreply.github.com"
          git add data/music-news.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "The programme: music broadcasts and stories $(date -u +%Y-%m-%d)" && git pull --rebase && git push; fi
