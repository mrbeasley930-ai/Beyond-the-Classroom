name: Geography hazard board

# Pulls the hazard feeds (USGS, NASA EONET, GDACS) and the geography news feeds every morning
# and commits data/geography-news.json, which the Geography page ("The Overpass") reads.
# Nothing else on the site changes.

on:
  schedule:
    - cron: "25 6 * * *"     # 06:25 UTC daily, after the French rack (05:40), the Physics ticker (05:55) and the Engineering pit wall (06:10)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geography-news
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the feeds
        run: python3 tools/fetch_geography_news.py
      - name: Commit if changed
        run: |
          git config user.name "overpass-bot"
          git config user.email "overpass-bot@users.noreply.github.com"
          git add data/geography-news.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Hazard board: geography events and stories $(date -u +%Y-%m-%d)" && git pull --rebase && git push; fi
